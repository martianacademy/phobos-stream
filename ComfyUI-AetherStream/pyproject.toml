[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comfyui-aetherstream"
version = "0.1.0"
description = "Zero-VRAM Video & Image Diffusion Streaming Extension for ComfyUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Martian Academy", email = "research@martian.academy" }]
dependencies = [
    "numpy>=1.26.0",
    "safetensors>=0.4.5",
]

[project.urls]
Repository = "https://github.com/martianacademy/ComfyUI-AetherStream"

[tool.comfy]
PublisherId = "martianacademy"
DisplayName = "ComfyUI-AetherStream"
Icon = "🌌"
