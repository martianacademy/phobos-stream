name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Populate ComfyUI-PhobosStream bundle for standalone integration test
        run: |
          if [ ! -f ComfyUI-PhobosStream/__init__.py ]; then
            rm -rf ComfyUI-PhobosStream
            git clone --depth 1 https://github.com/martianacademy/ComfyUI-PhobosStream.git ComfyUI-PhobosStream
          fi
      - uses: astral-sh/setup-uv@v4
      - name: Ensure ffmpeg is available for MP4 video export tests
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - name: Install dependencies & run pytest
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
          uv run pytest -v
