name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies & run pytest
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
          uv run pytest -v
