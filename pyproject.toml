[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aether-stream"
version = "0.1.0"
description = "Universal Zero-VRAM Video & Image Diffusion Streaming Engine (MLX • CUDA • ROCm • GGUF)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Martian Academy", email = "research@martian.academy" }]
dependencies = [
    "numpy>=1.26.0",
    "safetensors>=0.4.5",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "mlx>=0.22.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
cuda = [
    "torch>=2.4.0",
]
gguf = [
    "gguf>=0.10.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
aether-stream = "aether_stream.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
