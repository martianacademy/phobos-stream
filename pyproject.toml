[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phobos-stream"
version = "0.4.0"
description = "Universal Zero-VRAM Video & Image Diffusion Streaming Engine (MLX • CUDA • MPS • ROCm • GGUF)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Martian Academy", email = "research@martian.academy" }]
keywords = ["diffusion", "comfyui", "mlx", "zero-vram", "dit", "flux", "wan2.1", "mmap", "offloading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26.0",
    "safetensors>=0.4.5",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "mlx>=0.22.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Homepage = "https://github.com/martianacademy/phobos-stream"
Repository = "https://github.com/martianacademy/phobos-stream"
Issues = "https://github.com/martianacademy/phobos-stream/issues"

[project.optional-dependencies]
cuda = [
    "torch>=2.4.0",
]
diffusers = [
    "torch>=2.4.0",
    "diffusers>=0.33.0",
    "transformers>=4.49.0",
    "accelerate>=1.2.0",
    "ftfy>=6.2.0",
]
gguf = [
    "gguf>=0.10.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
phobos-stream = "phobos_stream.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/phobos_stream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
